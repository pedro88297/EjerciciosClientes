<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El tiempo en Mérida</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="contenedor">

        <header>
            <p class="ubicacion">📍 MÉRIDA, EXTREMADURA</p>
            <h1>El tiempo hoy</h1>
            <p class="subtitulo">Consulta el estado del cielo en tu ciudad</p>
        </header>

        <section class="tarjeta">

            <div class="icono">
                ☀️
            </div>

            <h2 id="descripcion">Consultando…</h2>

            <div class="separador"></div>

            <p class="localidad">Mérida</p>
            <p class="coordenadas">38.91611° N · 6.34366° O</p>

        </section>

        <footer>
            <p>Datos meteorológicos proporcionados por Open-Meteo</p>
        </footer>

    </main>

</body>

</html>
