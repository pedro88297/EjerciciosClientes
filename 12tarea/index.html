<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clava los 10 segundos</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <main>
        <h1>Clava los 10 segundos</h1>

        <p>Intenta detener la ronda cuando hayan pasado exactamente 10 segundos.</p>

        <div class="botones">
            <button id="iniciar">Iniciar</button>
            <button id="detener" disabled>Detener</button>
            <button id="reiniciar">Reiniciar</button>
        </div>

        <section id="resultado">
            <p id="mensaje">Pulsa Iniciar e intenta detener la ronda a los 10 segundos</p>

            <div id="datos">
                <p id="inicio"></p>
                <p id="fin"></p>
                <p id="tiempo"></p>
                <p id="diferencia"></p>
                <p id="resultadoFinal"></p>
            </div>
        </section>
    </main>

</body>

</html>
